[project]
name = "send-2-kindle"
version = "0.1.0"
description = "Send local files to your Kindle from the command line."
authors = [{ name = "Marco Fura", email = "mjfura27@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "typer (>=0.27,<1.0)",
    "pydantic (>=2.13,<3.0)",
    "pydantic-settings (>=2.15,<3.0)",
    "email-validator (>=2.3,<3.0)",
    "python-dotenv (>=1.2,<2.0)",
]

[project.scripts]
s2k = "send_2_kindle.main:app"

[tool.poetry]
packages = [{ include = "send_2_kindle", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
ruff = "^0.16"
mypy = "^2.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
